[package]
name = "hipcheck"
description = """
Automatically assess and score software packages for supply chain risk.
"""
keywords = ["security", "sbom"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
version = "3.15.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://hipcheck.mitre.org"
repository = "https://github.com/mitre/hipcheck"
include = ["src/**", "LICENSE", "README.md", "build.rs", "proto/**"]
publish = false

# Rename the binary from the default "hipcheck" (based on the package name)
# to "hc".
[[bin]]
name = "hc"
path = "src/main.rs"

#============================================================================
# Workspace Configuration
#----------------------------------------------------------------------------

[workspace]

# Use the newest, even better feature resolver.
#
# In the future we'll be able to remove this, but for now without it Cargo
# will default to the old resolver.
resolver = "3"

# Members of the workspace.
members = [
    "library/hipcheck-common",
    "library/hipcheck-kdl",
    "library/hipcheck-macros",
    "library/hipcheck-sdk-macros",
    "library/hipcheck-workspace-hack",
    "sdk/rust",
    "plugins/git",
    "plugins/github",
    "plugins/npm",
    "plugins/activity",
    "plugins/affiliation",
    "plugins/binary",
    "plugins/churn",
    "plugins/entropy",
    "plugins/fuzz",
    "plugins/identity",
    "plugins/linguist",
    "plugins/review",
    "plugins/typo",
    "tests/test-plugins/activity-container",
    "tests/test-plugins/dummy_rand_data",
    "tests/test-plugins/dummy_sha256",
    "xtask",
]

# Make sure Hipcheck is run with `cargo run`.
#
# This means to use `xtask` with `cargo run` you need to specify the package.
# See `.cargo/config.toml` for how this is done.
#
# This list is equivalent to `members` except it removes `xtask` and the test
# plugin crates.
default-members = [
    "library/hipcheck-common",
    "library/hipcheck-kdl",
    "library/hipcheck-macros",
    "library/hipcheck-sdk-macros",
    "library/hipcheck-workspace-hack",
    "sdk/rust",
    "plugins/git",
    "plugins/github",
    "plugins/npm",
    "plugins/activity",
    "plugins/affiliation",
    "plugins/binary",
    "plugins/churn",
    "plugins/entropy",
    "plugins/fuzz",
    "plugins/identity",
    "plugins/linguist",
    "plugins/review",
    "plugins/typo",
]

[dependencies]

async-channel = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
cyclonedx-bom = { workspace = true }
dotenv = { workspace = true }
chrono = { workspace = true, features = ["alloc", "serde"] }
clap = { workspace = true, features = ["derive"] }
console = { workspace = true, features = ["windows-console-colors"] }
dialoguer = { workspace = true }
dirs = { workspace = true }
env_logger = { workspace = true }
flate2 = { workspace = true }
fs_extra = { workspace = true }
futures = { workspace = true }
# Vendor libgit2 and openssl so that they will be statically included
# and not cause problems on certain systems that might not have one or
# the other.
git2 = { workspace = true, features = ["vendored-libgit2", "vendored-openssl"] }
hex = { workspace = true }
# Include with both a `path` and `version` reference.
# Local builds will use the `path` dependency, which may be a newer
# version than the one published to Crates.io.
# People building from Crates.io will use the published version.
#
# See: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#multiple-locations
hipcheck-kdl = { workspace = true }
hipcheck-macros = { workspace = true }
http = { workspace = true }
indextree = { workspace = true }
indicatif = { workspace = true, features = ["rayon"] }
itertools = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
logos = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true, features = ["datetime"] }
nom = { workspace = true }
num-traits = { workspace = true }
ordered-float = { workspace = true, features = ["serde"] }
packageurl = { workspace = true }
pathbuf = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
# Exactly matching the version of rustls used by ureq
# Get rid of default features since we don't use the AWS backed crypto
# provider (we use ring) and it breaks stuff on windows.
rustls = { workspace = true, features = ["logging", "std", "tls12", "ring"] }
rustls-platform-verifier = { workspace = true }
salsa = { workspace = true }
schemars = { workspace = true, features = [
    "derive",
    "preserve_order",
    "chrono04",
    "url2",
] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
smart-default = { workspace = true }
spdx-rs = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tabled = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "fs",
] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, features = ["json", "tls"] }
url = { workspace = true, features = ["serde"] }
walkdir = { workspace = true }
which = { workspace = true }
xml-rs = { workspace = true }
xz2 = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }
hipcheck-common = { workspace = true, features = ["rfd9-compat"] }
serde_with = { workspace = true }
gomod-rs = { workspace = true }
hipcheck-workspace-hack = { workspace = true }

[build-dependencies]

anyhow = { workspace = true }
pathbuf = { workspace = true }
schemars = { workspace = true, features = ["chrono04", "url2"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true, features = ["serde"] }
which = { workspace = true }

[dev-dependencies]

dirs = { workspace = true }
test-log = { workspace = true }

# The profile that 'cargo dist' will build with
#
# For now this is just the release profile, but with "thin" Link-Time
# Optimization enabled. This performs _some_ LTO and tries to hit the
# right trade-off between the runtime performance improvements of more
# LTO and the compile time cost of doing LTO.
[profile.dist]
inherits = "release"
lto = "thin"


#============================================================================
# `cargo-release` Configuration
#
# We use `cargo-release` to automate the release process, including creating
# a release commit, tagging it, and publishing to Crates.io.
#----------------------------------------------------------------------------

[workspace.metadata.release]

# Commit message to use when doing a release.
#
# This is in a Conventional Commits format to play nicely with `git-cliff`.
pre-release-commit-message = "chore: Release {{crate_name}}-v{{version}}"

# Whether to use a single commit when releasing versions of multiple
# crates in a workspace.
consolidate-commits = false


#============================================================================
# `cargo-autoinherit` Configuration
#
# We use `cargo-autoinherit` to set all dependencies at the workspace root
# level, so we limit the possibility of ending up with multiple versions of
# a single dependency.
#----------------------------------------------------------------------------

[workspace.metadata.cargo-autoinherit]
# Skip cargo-autoinherit for these packages
exclude-members = ["hipcheck-workspace-hack"]


#============================================================================
# Dependencies
#
# The Hipcheck project centralizes all dependencies at the workspace root,
# so here is where they're listed.
#----------------------------------------------------------------------------

[workspace.dependencies]
