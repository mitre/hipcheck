hipcheck-kdl = { version = "0.2.0", path = "library/hipcheck-kdl" }
hipcheck-macros = { version = "0.4.0", path = "library/hipcheck-macros" }
hipcheck-sdk = { version = "0.7.0", path = "sdk/rust" }
hipcheck-sdk-macros = { version = "0.3.0", path = "library/hipcheck-sdk-macros" }
hipcheck-workspace-hack = { version = "0.1", path = "library/hipcheck-workspace-hack" }
http = "1.3.1"
indexmap = "2.12.0"
indextree = "4.7.4"
indicatif = "0.18.3"
itertools = "0.14.0"
jiff = { version = "0.2.16", default-features = false }
kdl = "6.5.0"
lazy_static = "1.5.0"
log = { version = "0.4.28", default-features = false }
logos = "0.15.1"
lru = "0.16.2"
maplit = "1.0.2"
miette = "7.6.0"
minijinja = "2.12.0"
minijinja-contrib = "2.12.0"
nom = "7.1.3"
num-traits = "0.2.19"
ordered-float = "5.1.0"
packageurl = "0.5.0"
pathbuf = "1.0.0"
pep440_rs = "0.7.3"
proc-macro2 = "1.0.103"
prost = "0.14.1"
pyproject-toml = "0.13.7"
quote = "1.0.42"
rand = "0.9.2"
rayon = "1.11.0"
regex = "1.12.2"
rustls = { version = "0.23.35", default-features = false }
rustls-platform-verifier = "0.6.2"
salsa = "0.24.0"
schemars = "1.1.0"
semver = "1.0.27"
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = "3.16.0"
sha2 = "0.10.9"
smart-default = "0.7.1"
spdx-rs = "0.5.5"
strum = "0.27.2"
strum_macros = "0.27.2"
