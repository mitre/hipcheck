name: Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true

permissions: {}

jobs:
  push:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'hipcheck-v') }}
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-digest: ${{ steps.build-push-release.outputs.digest }}
      image-version: ${{ steps.format-tag.outputs.replaced }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Qemu
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Extract Hipcheck version
        uses: frabert/replace-string-action@9c9aeb483eab07adb9d0be75b5212cc0bcef0d4b # v2.5.1
        id: format-tag
        with:
          pattern: "hipcheck-v"
          string: "${{ github.event.release.tag_name || github.event.inputs.version }}"
          replace-with: ""
          flags: "g"

      - name: Login to DockerHub
        if: ${{ github.event_name == 'release' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push release image
        if: ${{ github.event_name == 'release' }}
        id: build-push-release
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: .
          file: dist/Containerfile
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: mitre/hipcheck:latest,mitre/hipcheck:${{ steps.format-tag.outputs.replaced }}

      - name: Build local test image archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: .
          file: dist/Containerfile
          push: false
          platforms: "linux/amd64"
          outputs: type=docker,dest=./hipcheck-docker-image.tar

      - name: Upload local test image archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-archive
          path: hipcheck-docker-image.tar

  build-sbom:
    name: Generate Docker SBOMs
    needs: push
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE_DIGEST: ${{ needs.push.outputs.image-digest }}
      IMAGE_VERSION: ${{ needs.push.outputs.image-version }}
      SYFT_VERSION: v1.55.0
      SYFT_TGZ: syft_1.55.0_linux_amd64.tar.gz
      SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
    steps:
      - name: Download local test image archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: docker-image-archive
          path: artifacts

      - name: Verify release image digest exists
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "Docker image digest is missing" >&2
            exit 1
          fi

      - name: Verify local test image archive exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "artifacts/hipcheck-docker-image.tar" ]]; then
            echo "Expected local Docker image archive not found: artifacts/hipcheck-docker-image.tar" >&2
            exit 1
          fi

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -sSfL \
            -o "$SYFT_TGZ" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${SYFT_TGZ}"

          echo "${SYFT_SHA256}  ${SYFT_TGZ}" | sha256sum -c -

          tar -xzf "$SYFT_TGZ" syft
          mkdir -p "$HOME/.local/bin"
          install -m 0755 syft "$HOME/.local/bin/syft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/syft" version

      - name: Generate SPDX 2.3 and 3.0 SBOMs for released Docker image
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating SPDX 2.3 SBOM for mitre/hipcheck@${IMAGE_DIGEST}"
          syft "registry:mitre/hipcheck@${IMAGE_DIGEST}" -o spdx-json > "hipcheck-docker-${IMAGE_VERSION}.spdx-2.3.json"

          echo "Generating SPDX 3.0 SBOM for mitre/hipcheck@${IMAGE_DIGEST}"
          syft "registry:mitre/hipcheck@${IMAGE_DIGEST}" -o spdx-json@3.0 > "hipcheck-docker-${IMAGE_VERSION}.spdx-3.0.json"

      - name: Generate SPDX 2.3 and 3.0 SBOMs for local test image archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating SPDX 2.3 SBOM for local Docker image archive"
          syft "docker-archive:artifacts/hipcheck-docker-image.tar" -o spdx-json > "hipcheck-docker-${IMAGE_VERSION}.spdx-2.3.json"

          echo "Generating SPDX 3.0 SBOM for local Docker image archive"
          syft "docker-archive:artifacts/hipcheck-docker-image.tar" -o spdx-json@3.0 > "hipcheck-docker-${IMAGE_VERSION}.spdx-3.0.json"

      - name: Verify generated Docker SBOM files
        shell: bash
        run: |
          set -euo pipefail
          ls -1 hipcheck-docker-*.spdx-2.3.json hipcheck-docker-*.spdx-3.0.json

      - name: Upload Docker SBOMs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-sboms
          path: |
            hipcheck-docker-*.spdx-2.3.json
            hipcheck-docker-*.spdx-3.0.json

  upload-release-sboms:
    name: Upload Docker SBOMs to GitHub Release
    if: ${{ github.event_name == 'release' }}
    needs:
      - push
      - build-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Docker SBOMs
        uses: actions/download-artifact@v4
        with:
          name: docker-sboms
          path: artifacts

      - name: Upload Docker SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            artifacts/*.spdx-2.3.json \
            artifacts/*.spdx-3.0.json \
            --clobber \
            --repo "$GH_REPO"

  description:
    name: Set Description
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify Dockerhub description size
        run: ./dist/dockerhub/check-description-size.sh

      - name: Update Dockerhub description
        if: success()
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_DESC_TOKEN }}
          repository: mitre/hipcheck
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./dist/dockerhub/README.md
          enable-url-completion: true
