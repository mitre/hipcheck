<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Illustrative Night Vision data status page</title>
  <desc id="description">A wireframe of the data status page showing stale KEV data, upstream source freshness, and its impact on assessments.</desc>
  <style>
    .ink { fill:#17212b; font-family:Inter,Arial,sans-serif; }.muted { fill:#687789; font-family:Inter,Arial,sans-serif; }.tiny { font-family:Inter,Arial,sans-serif; font-size:12px; }.small { font-family:Inter,Arial,sans-serif; font-size:14px; }.heading { font-family:Inter,Arial,sans-serif; font-size:27px; font-weight:700; }
  </style>
  <rect width="1200" height="720" rx="14" fill="#f7f9fa"/><rect x="1" y="1" width="1198" height="718" rx="13" fill="none" stroke="#cbd3db"/><rect x="1" y="1" width="1198" height="61" rx="13" fill="#fff"/><path d="M1 61h1198" stroke="#dce2e7"/>
  <rect x="28" y="18" width="25" height="25" rx="7" fill="#0f766e"/><text x="40" y="36" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">◇</text><text x="63" y="37" class="ink" font-size="17" font-weight="700">Night Vision</text><text x="1138" y="36" class="muted tiny" text-anchor="end">Data freshness: attention needed</text>
  <rect x="1" y="62" width="211" height="657" fill="#f4f6f8"/><path d="M211 62v657" stroke="#dce2e7"/><text x="23" y="99" class="muted tiny" font-weight="700">WORKSPACE</text><text x="27" y="133" class="muted small">◫  Assessments</text><text x="27" y="171" class="muted small">◌  Package sources</text><text x="23" y="220" class="muted tiny" font-weight="700">SYSTEM</text><rect x="13" y="232" width="176" height="35" rx="6" fill="#dff3f0"/><text x="27" y="254" fill="#145f5a" font-family="Inter,Arial" font-size="14" font-weight="700">◷  Data status</text>
  <text x="244" y="116" class="heading ink">Data status</text><text x="244" y="142" class="muted small">Freshness and synchronization state for data used in upgrade assessments.</text>
  <rect x="244" y="168" width="920" height="70" rx="8" fill="#fff8e9" stroke="#ead39c"/><rect x="260" y="185" width="24" height="24" rx="12" fill="#fff0cd"/><text x="272" y="202" text-anchor="middle" fill="#936009" font-family="Arial" font-size="14" font-weight="700">!</text><text x="296" y="191" fill="#735215" class="small" font-weight="700">KEV data is stale</text><text x="296" y="215" fill="#795e27" class="tiny">The last successful CISA KEV sync was 29 hours ago. Assessments may not reflect newly added KEV records.</text>
  <text x="244" y="279" class="ink" font-size="17" font-weight="700">Upstream data</text><text x="244" y="302" class="muted tiny">Night Vision shows source freshness alongside assessment evidence.</text>
  <rect x="244" y="319" width="920" height="196" rx="9" fill="#fff" stroke="#d5dde4"/><rect x="245" y="320" width="918" height="39" rx="8" fill="#f7f9fa"/><path d="M244 359h920M244 437h920" stroke="#e2e6ea"/><text x="260" y="344" class="muted tiny" font-weight="700">DATASET</text><text x="467" y="344" class="muted tiny" font-weight="700">STATUS</text><text x="592" y="344" class="muted tiny" font-weight="700">LAST SUCCESSFUL SYNC</text><text x="798" y="344" class="muted tiny" font-weight="700">LAST ATTEMPT</text><text x="957" y="344" class="muted tiny" font-weight="700">ASSESSMENT EFFECT</text>
  <text x="260" y="389" class="small ink" font-weight="700">CVE data</text><text x="260" y="412" class="muted tiny">Approved vulnerability source</text><rect x="467" y="380" width="64" height="21" rx="10" fill="#def4e8"/><text x="499" y="395" text-anchor="middle" fill="#147044" class="tiny" font-weight="700">✓ Current</text><text x="592" y="394" class="tiny ink">Today, 8:45 AM</text><text x="798" y="394" class="tiny ink">Today, 8:45 AM</text><text x="957" y="394" class="tiny ink">Vulnerability matching is current</text>
  <text x="260" y="467" class="small ink" font-weight="700">CISA KEV catalog</text><text x="260" y="490" class="muted tiny">Known Exploited Vulnerabilities</text><rect x="467" y="458" width="54" height="21" rx="10" fill="#fff1d7"/><text x="494" y="473" text-anchor="middle" fill="#906109" class="tiny" font-weight="700">! Stale</text><text x="592" y="472" class="tiny ink">Yesterday, 4:12 AM</text><text x="798" y="472" class="tiny ink">Today, 9:03 AM · failed</text><text x="957" y="472" class="tiny ink">New KEV listings may be missing</text>
  <text x="244" y="556" class="ink" font-size="17" font-weight="700">How this affects assessments</text><rect x="244" y="574" width="920" height="91" rx="9" fill="#fff" stroke="#d5dde4"/><circle cx="273" cy="603" r="13" fill="#e5effb"/><text x="273" y="608" text-anchor="middle" fill="#2668a5" font-family="Arial" font-size="14" font-weight="700">i</text><text x="298" y="602" class="small ink" font-weight="700">Review data freshness with the assessment evidence.</text><text x="298" y="626" class="muted tiny">A stale source reduces confidence in conclusions that depend on new or changed upstream records; it does not prove an existing assessment is incorrect.</text><text x="298" y="650" fill="#0f766e" class="tiny" font-weight="700">• New KEV links may not appear yet  ·  • Existing verdicts show their evidence time  ·  • No compliance deadlines are calculated</text>
  <text x="244" y="697" class="muted tiny">Illustrative information hierarchy only — the live UI may use a different visual treatment.</text>
</svg>
