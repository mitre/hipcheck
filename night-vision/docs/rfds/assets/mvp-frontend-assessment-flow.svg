  <text class="mono tiny" x="121" y="540">4.17.21</text><rect x="469" y="526" width="126" height="19" rx="10" fill="#def4e8"/><text x="532" y="540" text-anchor="middle" fill="#147044" class="tiny" font-weight="700">✓ No longer affected</text><rect x="1005" y="524" width="72" height="23" rx="5" fill="#0f766e"/><text x="1041" y="540" text-anchor="middle" fill="#fff" class="tiny" font-weight="700">Selected</text>
  <text class="mono tiny" x="121" y="577">4.17.22</text><rect x="469" y="563" width="139" height="19" rx="10" fill="#fff1d7"/><text x="538" y="577" text-anchor="middle" fill="#906109" class="tiny" font-weight="700">? Evidence unavailable</text><rect x="1014" y="561" width="63" height="23" rx="5" fill="#fff" stroke="#c8d1d9"/><text x="1045" y="577" text-anchor="middle" class="tiny">Choose</text>

  <path class="line" d="M122 591v28"/><text x="122" y="629" text-anchor="middle" fill="#0f766e" font-family="Arial" font-size="20">↓</text>
  <rect class="surface" x="94" y="640" width="1012" height="123" rx="9"/>
  <path d="M94 689h1012M431 689v74M768 689v74" stroke="#e0e5ea"/>
  <circle cx="122" cy="665" r="12" fill="#e2f2f0"/><text class="stage tiny" x="122" y="670" text-anchor="middle">3</text><text class="heading ink" x="144" y="671">Check the selected release</text><text class="muted tiny" x="1082" y="670" text-anchor="end">Candidate 4.17.21</text>
  <text class="muted tiny" x="121" y="717">VULNERABILITY STATUS</text><text class="ink small" x="121" y="743">✓ Outside affected range</text>
  <text class="muted tiny" x="457" y="717">SUPPLY-CHAIN SIGNALS</text><text class="ink small" x="457" y="743">✓ No blocking findings</text>
  <text class="muted tiny" x="794" y="717">EVIDENCE QUALITY</text><text class="ink small" x="794" y="743">✓ Sources agree</text>

  <path class="line" d="M122 763v28"/><text x="122" y="801" text-anchor="middle" fill="#0f766e" font-family="Arial" font-size="20">↓</text>
  <rect class="surface" x="94" y="812" width="1012" height="151" rx="9"/>
  <path d="M94 861h1012" stroke="#e0e5ea"/>
  <circle cx="122" cy="837" r="12" fill="#e2f2f0"/><text class="stage tiny" x="122" y="842" text-anchor="middle">4</text><text class="heading ink" x="144" y="843">Make the recommendation</text><text class="muted tiny" x="1082" y="842" text-anchor="end">Based on the checks above</text>
  <circle cx="130" cy="899" r="18" fill="#dbf3e7"/><text x="130" y="905" text-anchor="middle" fill="#147246" font-family="Arial" font-size="19" font-weight="700">✓</text>
  <text class="heading ink" x="160" y="891">Recommended</text><text class="muted small" x="160" y="916">4.17.21 appears to remove the KEV-linked exposure; completed checks found no serious signal.</text>
  <text x="160" y="944" fill="#188055" class="tiny" font-weight="700">✓ Issue appears fixed</text><text x="373" y="944" fill="#188055" class="tiny" font-weight="700">✓ No blocking signal</text><text x="603" y="944" fill="#188055" class="tiny" font-weight="700">✓ Patch-level upgrade</text>
  <text class="muted tiny" x="94" y="992">Illustrative information flow only — the live UI may use a different visual treatment.</text>
</svg>
