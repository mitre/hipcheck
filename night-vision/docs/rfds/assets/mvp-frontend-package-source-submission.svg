<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Illustrative Night Vision package source submission page</title>
  <desc id="description">A wireframe of the page used to name and submit an NPM package manifest for dependency resolution.</desc>
  <style>
    .ink { fill:#17212b; font-family:Inter,Arial,sans-serif; }.muted { fill:#687789; font-family:Inter,Arial,sans-serif; }.mono { fill:#17212b; font-family:Menlo,Consolas,monospace; }.tiny { font-family:Inter,Arial,sans-serif; font-size:12px; }.small { font-family:Inter,Arial,sans-serif; font-size:14px; }.heading { font-family:Inter,Arial,sans-serif; font-size:27px; font-weight:700; }
  </style>
  <rect width="1200" height="760" rx="14" fill="#f7f9fa"/><rect x="1" y="1" width="1198" height="758" rx="13" fill="none" stroke="#cbd3db"/><rect x="1" y="1" width="1198" height="61" rx="13" fill="#fff"/><path d="M1 61h1198" stroke="#dce2e7"/>
  <rect x="28" y="18" width="25" height="25" rx="7" fill="#0f766e"/><text x="40" y="36" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">◇</text><text x="63" y="37" class="ink" font-size="17" font-weight="700">Night Vision</text><text x="1138" y="36" class="muted tiny" text-anchor="end">Data freshness: current</text>
  <rect x="1" y="62" width="211" height="697" fill="#f4f6f8"/><path d="M211 62v697" stroke="#dce2e7"/><text x="23" y="99" class="muted tiny" font-weight="700">WORKSPACE</text><text x="27" y="133" class="muted small">◫  Assessments</text><rect x="13" y="149" width="176" height="35" rx="6" fill="#dff3f0"/><text x="27" y="171" fill="#145f5a" font-family="Inter,Arial" font-size="14" font-weight="700">◌  Package sources</text><text x="23" y="220" class="muted tiny" font-weight="700">SYSTEM</text><text x="27" y="254" class="muted small">◷  Data status</text>
  <text x="282" y="105" class="muted tiny">Package sources / Add package source</text><text x="282" y="145" class="heading ink">Add package source</text><text x="282" y="171" class="muted small">Submit an NPM package.json to resolve reachable dependencies and find KEV-linked exposures.</text>
  <rect x="282" y="196" width="716" height="481" rx="9" fill="#fff" stroke="#d5dde4"/><text x="301" y="225" class="ink small" font-weight="700">Source details</text><path d="M282 242h716" stroke="#e0e5ea"/>
  <text x="301" y="276" class="ink tiny" font-weight="700">SOURCE NAME</text><rect x="301" y="287" width="678" height="37" rx="6" fill="#fff" stroke="#cbd4dc"/><text x="313" y="311" class="ink small">agency-web</text><text x="301" y="345" class="muted tiny">Use a short name that identifies this application or repository.</text>
  <text x="301" y="382" fill="#155f5a" class="tiny" font-weight="700">Paste manifest</text><text x="410" y="382" class="muted tiny" font-weight="700">Upload package.json</text><path d="M301 391h678" stroke="#e0e5ea"/><path d="M301 391h89" stroke="#0f766e" stroke-width="2"/>
  <text x="301" y="421" class="ink tiny" font-weight="700">PACKAGE.JSON</text><rect x="301" y="432" width="678" height="131" rx="6" fill="#fff" stroke="#cbd4dc"/><text x="316" y="456" class="mono" font-size="12">{</text><text x="332" y="478" class="mono" font-size="12">"name": "agency-web",</text><text x="332" y="500" class="mono" font-size="12">"dependencies": { "lodash": "4.17.20" }</text><text x="316" y="522" class="mono" font-size="12">}</text><text x="301" y="586" class="muted tiny">Night Vision accepts a valid NPM package manifest. Lockfiles and other ecosystems are outside the MVP.</text>
  <rect x="301" y="605" width="678" height="45" rx="6" fill="#edf8f6"/><rect x="301" y="605" width="3" height="45" fill="#0f766e"/><text x="316" y="632" fill="#245a55" class="tiny">ⓘ  Submitting starts dependency resolution. Follow progress and review errors from the source detail page.</text>
  <rect x="810" y="689" width="85" height="29" rx="6" fill="#fff" stroke="#c7d0d9"/><text x="852" y="708" text-anchor="middle" class="ink tiny" font-weight="700">Cancel</text><rect x="904" y="689" width="122" height="29" rx="6" fill="#0f766e"/><text x="965" y="708" text-anchor="middle" fill="#fff" class="tiny" font-weight="700">Validate and submit</text>
  <text x="282" y="744" class="muted tiny">Illustrative information hierarchy only — the live UI may use a different visual treatment.</text>
</svg>
