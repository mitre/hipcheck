services:
  nv-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nv-app:local
    pull_policy: missing
    ports:
      - "127.0.0.1:3000:3000"

  nv-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nv-server:local
    pull_policy: missing
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    pull_policy: missing

volumes:
  postgres-data:
    name: night-vision-local-postgres-data

secrets:
  nv-server-database-url:
    file: ${NV_SERVER_DATABASE_URL_SECRET_FILE:?NV_SERVER_DATABASE_URL_SECRET_FILE is required}
  postgres-password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:?POSTGRES_PASSWORD_SECRET_FILE is required}
